# Gather, check and publish On.
# Copy this file to .github/workflows/publish.yml using GitHub's web editor
# (Add file > Create new file, name it .github/workflows/publish.yml, paste).
#
# It runs on every push, every six hours, and when you press 'Run workflow'
# under the Actions tab. Each run reads the Yoso sites, saves anything new,
# runs check.py and publishes only if the check passes.

name: Gather, check and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather new work from the sites
        run: python3 build.py

      - name: Save what was gathered
        run: |
          git config user.name "On gatherer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/items.js feed.xml data/archive.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Gather new work"
            git push
          fi

      - name: Check the site
        run: python3 check.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
